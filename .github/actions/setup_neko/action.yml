name: Setup the Neko library
description: |
  This action sets up the Neko library for use in the main workflow.

# ---------------------------------------------------------------------------- #
# Define the inputs and outputs for this action. The inputs are used to
# configure the action, while the outputs are used to pass information
# back to the caller.

inputs:
  install-dir:
    description: "The directory to install the Neko library."
    required: false
    default: "/home/runner/pkg/neko"

  working-dir:
    description: "The directory to work in when compiling Neko."
    required: false
    default: "/home/runner/tmp/neko"

  json-fortran-dir:
    description: "The directory where the JSON-Fortran library was installed."
    required: false
    default: "/home/runner/pkg/json-fortran"

  os:
    description: "The operating system to use."
    required: false
    default: "${{ runner.os }}"

  compiler:
    description: "The compiler to use."
    required: false
    default: "gfortran"

  compiler-flags:
    description: "The compiler flag to use."
    required: false
    default: "-O2 -std=f2018"

  build-options:
    description: "The build option to use."
    required: false
    default: "-j $(nproc)"

  version:
    description: "The version of the Neko library to use."
    required: false
    default: "v0.7.2"

outputs:
  install-dir:
    description: "The directory where the Neko library was installed."
    value: ${{ steps.set-output.outputs.install-dir }}

# ---------------------------------------------------------------------------- #
# Define the steps that will be run in this action. The steps are run in a
# sequence, where the Cache step is run first. The Set output step runs last.

runs:
  using: composite
  steps:
    # ------------------------------------------------------------------------ #
    # Cache the Neko library
    #
    # This step caches the Neko library to speed up the workflow.
    # If we wish to use the developer version of the Neko library, we
    # we will use the date as the cache key. Otherwise, we will use the
    # version of the Neko library as the cache key.

    - name: Create cache key based on version, OS, and compiler
      id: create-key
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        OS: ${{ inputs.os }}
        COMPILER: ${{ inputs.compiler }}
        COMPILER_FLAGS: ${{ inputs.compiler-flags }}
        REPO: https://github.com/ExtremeFLOW/neko.git
      run: |
        # Get the GIT sha for the current commit
        SHA=$(git ls-remote $REPO $VERSION | awk '{print $1}')
        key="neko-$VERSION-$SHA-$OS-$COMPILER-${COMPILER_FLAGS// /_}"
        printf "key=%s\n" "$key" | tee -a $GITHUB_OUTPUT

    - name: Create cache for the Neko library
      id: cache-neko
      uses: actions/cache@v4
      with:
        path: ${{ inputs.install-dir }}
        key: ${{ steps.create-key.outputs.key }}

    # ------------------------------------------------------------------------ #
    # Setup the system for building the Neko library

    - name: Install system dependencies
      if: ${{ steps.cache-neko.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        sudo apt install autotools-dev automake autoconf openmpi-bin \
          pkg-config liblapack-dev libopenblas-dev libopenmpi-dev

    # ------------------------------------------------------------------------ #
    # Clone and build the Neko library
    #
    # This step clones the Neko library and builds it.

    - name: Clone neko
      if: ${{ steps.cache-neko.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        WORKING_DIR: ${{ inputs.working-dir }}
        REPO: https://github.com/ExtremeFLOW/neko.git
        VERSION: ${{ inputs.version }}
      run: |
        git clone --depth 1 --branch $VERSION $REPO $WORKING_DIR

    - name: Configure and install neko
      if: ${{ steps.cache-neko.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        INSTALL_DIR: ${{ inputs.install-dir }}
        WORKING_DIR: ${{ inputs.working-dir }}
        FC: ${{ inputs.compiler }}
        FCFLAGS: ${{ inputs.compiler-flags }}
      run: |
        cd $WORKING_DIR
        ./regen.sh
        ./configure --prefix=$INSTALL_DIR FC=$FC FCFLAGS="$FCFLAGS"
        make install ${{ inputs.build-options }}

    # ------------------------------------------------------------------------ #
    # Cleanup and outputs
    #
    # This step cleans up the working directory and sets the output.

    - name: Cleanup
      if: ${{ steps.cache-neko.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        INSTALL_DIR: ${{ inputs.install-dir }}
        WORKING_DIR: ${{ inputs.working-dir }}
      run: |
        echo "INSTALL_DIR: $INSTALL_DIR"
        echo "WORKING_DIR: $WORKING_DIR"

        if [ $(echo "$INSTALL_DIR" | grep -q "$WORKING_DIR") ]; then
          rm -rf $WORKING_DIR
        fi

    - name: Set output
      id: set-output
      shell: bash
      env:
        INSTALL_DIR: ${{ inputs.install-dir }}
      run: |
        echo "install-dir=$(echo ${INSTALL_DIR})" >> $GITHUB_OUTPUT
        echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}:${INSTALL_DIR}/lib/pkgconfig" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}:${INSTALL_DIR}/lib" >> $GITHUB_ENV
        echo "PATH=${INSTALL_DIR}/bin:${PATH}" >> $GITHUB_ENV
