name: Setup the pFUnit library
description: |
  This action sets up the pFUnit library for use in the main workflow.

# ---------------------------------------------------------------------------- #
# Define the inputs and outputs for this action. The inputs are used to
# configure the action, while the outputs are used to pass information
# back to the caller.

inputs:
  install-dir:
    description: "The directory to install the pFUnit library."
    required: false
    default: "/home/runner/pkg/pfunit"

  working-dir:
    description: "The directory to work in."
    required: false
    default: "/home/runner/tmp/pfunit"

  os:
    description: "The operating system to use."
    required: false
    default: "${{ runner.os }}"

  compiler:
    description: "The compiler to use."
    required: false
    default: "mpif90"

  compiler-flags:
    description: "The compiler flag to use."
    required: false
    default: "-O3"

  build-options:
    description: "The build option to use."
    required: false
    default: "--parallel $(nproc)"

  version:
    description: "The version of the pFUnit library to use."
    required: false
    default: "v4.8.0"

outputs:
  install-dir:
    description: "The directory where the pFUnit library was installed."
    value: ${{ steps.set-output.outputs.install-dir }}

# ---------------------------------------------------------------------------- #
# Define the steps that will be run in this action.
#
# If we have not cached the pFUnit library, we will clone the repository,
# configure the build, build the library, install the library, and clean up.

runs:
  using: composite
  steps:
    # ------------------------------------------------------------------------ #
    # Check the cache and clone the repository if necessary

    - name: Create cache key based on version, OS, and compiler
      id: create-key
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        OS: ${{ inputs.os }}
        COMPILER: ${{ inputs.compiler }}
        COMPILER_FLAGS: ${{ inputs.compiler-flags }}
        REPO: https://github.com/Goddard-Fortran-Ecosystem/pFUnit.git
      run: |
        # Get the GIT sha for the current commit
        SHA=$(git ls-remote $REPO $VERSION | awk '{print $1}')
        key="pfunit-$SHA-$OS-$COMPILER-${COMPILER_FLAGS// /_}"
        printf "key=%s\n" "$key" | tee -a $GITHUB_OUTPUT

    - name: Cache
      id: cache-pfunit
      uses: actions/cache@v5
      with:
        path: ${{ inputs.install-dir }}
        key: ${{ steps.create-key.outputs.key }}

    - name: Clone
      if: ${{ steps.cache-pfunit.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        WORKING_DIR: ${{ inputs.working-dir }}
        REPO: https://github.com/Goddard-Fortran-Ecosystem/pFUnit.git
        VERSION: ${{ inputs.version }}
      run: |
        git clone --depth 1 --branch $VERSION $REPO $WORKING_DIR

    # ------------------------------------------------------------------------ #
    # Setup the system for building the pFUnit library

    - name: Install dependencies
      if: ${{ steps.cache-pfunit.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        sudo apt install openmpi-bin liblapack-dev libopenmpi-dev libopenblas-dev

    # ------------------------------------------------------------------------ #
    # Configure, build, install the library

    - name: Configure
      if: ${{ steps.cache-pfunit.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        INSTALL_DIR: ${{ inputs.install-dir }}
        WORKING_DIR: ${{ inputs.working-dir }}
        FC: ${{ inputs.compiler }}
        FCFLAGS: ${{ inputs.compiler-flags }}
      run: |
        cmake -B $WORKING_DIR/build -S $WORKING_DIR \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DCMAKE_INSTALL_PREFIX=$INSTALL_DIR

    - name: Build
      if: ${{ steps.cache-pfunit.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        WORKING_DIR: ${{ inputs.working-dir }}
      run: |
        cmake --build $WORKING_DIR/build ${{ inputs.build-options }}

    - name: Install
      if: ${{ steps.cache-pfunit.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        WORKING_DIR: ${{ inputs.working-dir }}
      run: |
        cmake --install $WORKING_DIR/build

    # ------------------------------------------------------------------------ #
    # Cleanup the working directory and set the output

    - name: Set output
      shell: bash
      id: set-output
      run: |
        echo "install-dir=$(echo ${{ inputs.install-dir }})" >> $GITHUB_OUTPUT
