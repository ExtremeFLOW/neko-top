name: Setup the HDF5 library
description: |
  This action sets up the HDF5 library for use in the main workflow.

# ---------------------------------------------------------------------------- #
# Define the inputs and outputs for this action. The inputs are used to
# configure the action, while the outputs are used to pass information
# back to the caller.

inputs:
  install-dir:
    description: "The directory to install the HDF5 library."
    required: false
    default: "${{ runner.temp }}/pkg/hdf5"
  working-dir:
    description: "The directory to work in."
    required: false
    default: "${{ runner.temp }}/build/hdf5"
  os:
    description: "The operating system to use."
    required: false
    default: "${{ runner.os }}"
  compiler:
    description: "The compiler to use."
    required: false
    default: "mpif90"
  compiler-flags:
    description: "The compiler flag to use."
    required: false
    default: "-O3"
  c-compiler:
    description: "The C compiler to use."
    required: false
    default: "mpicc"
  c-compiler-flags:
    description: "The C compiler flag to use."
    required: false
    default: "-O3"
  build-options:
    description: "The build option to use."
    required: false
    default: "--parallel $(nproc)"
  version:
    description: "The version of the HDF5 library to use."
    required: false
    default: "2.0.0"
  arch:
    description: "The architecture to use."
    required: false
    default: "${{ runner.arch }}"

outputs:
  install-dir:
    description: "The directory where the HDF5 library was installed."
    value: ${{ steps.set-output.outputs.install-dir }}

# ---------------------------------------------------------------------------- #
# Define the steps that will be run in this action. The steps are run in a
# sequence, where the Cache step is run first. The Set output step runs last.

runs:
  using: composite
  steps:
    - name: Check the environment
      env:
        INSTALL_DIR: ${{ inputs.install-dir }}
        WORKING_DIR: ${{ inputs.working-dir }}
        OS: ${{ inputs.os }}
        COMPILER: ${{ inputs.compiler }}
        COMPILER_FLAGS: ${{ inputs.compiler-flags }}
        C_COMPILER: ${{ inputs.c-compiler }}
        C_COMPILER_FLAGS: ${{ inputs.c-compiler-flags }}
        VERSION: ${{ inputs.version }}
        ARCH: ${{ inputs.arch }}
      shell: bash
      run: |
        if [ -z "$INSTALL_DIR" ]; then
          echo "install-dir is not set" >&2
          exit 1
        fi
        if [ -z "$WORKING_DIR" ]; then
          echo "working-dir is not set" >&2
          exit 1
        fi
        if [ -z "$OS" ]; then
          echo "os is not set" >&2
          exit 1
        fi
        if [ -z "$COMPILER" ]; then
          echo "compiler is not set" >&2
          exit 1
        fi
        if [ -z "$C_COMPILER" ]; then
          echo "c-compiler is not set" >&2
          exit 1
        fi
        if [ -z "$VERSION" ]; then
          echo "version is not set" >&2
          exit 1
        fi
        if [ -z "$ARCH" ]; then
          echo "arch is not set" >&2
          exit 1
        fi

    # ------------------------------------------------------------------------ #
    # Setup the cache for the HDF5 library.
    # All following steps should look if the cache was hit and skip if it was.

    - name: Create cache key based on version, OS, and compiler
      id: create-key
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        OS: ${{ inputs.os }}
        COMPILER: ${{ inputs.compiler }}
        COMPILER_FLAGS: ${{ inputs.compiler-flags }}
        C_COMPILER: ${{ inputs.c-compiler }}
        C_COMPILER_FLAGS: ${{ inputs.c-compiler-flags }}
        ARCH: ${{ inputs.arch }}
        REPO: https://github.com/HDFGroup/hdf5.git
      run: |
        # Resolve the version (branch or tag) to a commit. The version keeps
        # the key readable, the SHA invalidates the cache when the ref moves.
        SHA=$(git ls-remote $REPO "refs/heads/$VERSION" "refs/tags/$VERSION" \
          | awk 'NR==1 {print $1}')
        if [ -z "$SHA" ]; then
          echo "Could not resolve version '$VERSION' in $REPO" >&2
          exit 1
        fi
        OS="$OS-$(source /etc/os-release && echo "$ID-$VERSION_ID")"
        key="hdf5-$VERSION-${SHA:0:7}-$OS-$COMPILER-${COMPILER_FLAGS// /_}"
        key="$key-$C_COMPILER-${C_COMPILER_FLAGS// /_}-$ARCH"
        printf "key=%s\n" "$key" | tee -a $GITHUB_OUTPUT

    - name: Cache
      id: cache-hdf5
      uses: actions/cache@v5
      with:
        path: ${{ inputs.install-dir }}
        key: ${{ steps.create-key.outputs.key }}

    - name: Clone
      if: ${{ steps.cache-hdf5.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        WORKING_DIR: ${{ inputs.working-dir }}
        REPO: https://github.com/HDFGroup/hdf5.git
        VERSION: ${{ inputs.version }}
      run: |
        git clone --depth 1 --branch $VERSION $REPO $WORKING_DIR

    # ------------------------------------------------------------------------ #
    # Configure, build, and install the HDF5 library.

    - name: Configure
      if: ${{ steps.cache-hdf5.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        INSTALL_DIR: ${{ inputs.install-dir }}
        WORKING_DIR: ${{ inputs.working-dir }}
        CC: mpicc
        FC: mpif90
        OMPI_FC: ${{ inputs.compiler }}
        OMPI_CC: ${{ inputs.c-compiler }}
        FCFLAGS: ${{ inputs.compiler-flags }}
        CFLAGS: ${{ inputs.c-compiler-flags }}
      run: |
        cmake -B $WORKING_DIR/build -S $WORKING_DIR -G Ninja \
            --install-prefix $INSTALL_DIR -DCMAKE_BUILD_TYPE=Release \
            -DHDF5_ENABLE_PARALLEL=ON -DHDF5_BUILD_FORTRAN=ON \
            -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF -DHDF5_BUILD_TOOLS:BOOL=ON

    - name: Build
      if: ${{ steps.cache-hdf5.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        WORKING_DIR: ${{ inputs.working-dir }}
      run: |
        cmake --build $WORKING_DIR/build --config Release

    - name: Install
      if: ${{ steps.cache-hdf5.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        WORKING_DIR: ${{ inputs.working-dir }}
      run: |
        cmake --install $WORKING_DIR/build --config Release

    # ------------------------------------------------------------------------ #
    # Cleanup and set the output.

    # Only the installation is cached and used afterwards; remove the sources
    # and build tree to free disk space on the runner.
    - name: Cleanup
      if: ${{ steps.cache-hdf5.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        WORKING_DIR: ${{ inputs.working-dir }}
      run: rm -rf "$WORKING_DIR"

    - name: Set output
      id: set-output
      shell: bash
      env:
        INSTALL_DIR: ${{ inputs.install-dir }}
      run: |

        if [ ! -d ${INSTALL_DIR}/lib ]; then
          echo "Failed to install HDF5 library."
          exit 1
        fi

        echo "install-dir=${INSTALL_DIR}"
        echo "install-dir=${INSTALL_DIR}" >> $GITHUB_OUTPUT
        echo "HDF5_ROOT=${INSTALL_DIR}" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}:${INSTALL_DIR}/lib" >> $GITHUB_ENV
        echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}:${INSTALL_DIR}/lib/pkgconfig" >> $GITHUB_ENV
        echo "PATH=${INSTALL_DIR}/bin:${PATH}" >> $GITHUB_ENV
