name: Deploy documentation to Pages

# Runs on every push to the develop branch. Since the develop branch is
# protected, only pull requests can be merged into it. This ensures that the
# documentation is only built and deployed when a pull request is merged.
on:
  push:
    branches:
      - "develop"

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. We do not wish to waste time on old runs if a
# newer one is available.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Setup system
        shell: bash
        run: |
          sudo apt install git cmake doxygen graphviz

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop


      - name: Configure documentation
        run: |
          cmake -DONLY_DOCS=ON -B build -S . -DCMAKE_BUILD_TYPE=Release


      - name: Build documentation
        run: |
          cmake --build build --target Documentation

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./documentation/html"

  deploy:
    name: Deploy documentation
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
