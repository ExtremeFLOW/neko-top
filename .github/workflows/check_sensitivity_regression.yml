# This workflow runs the realistic (~1000-timestep) sensitivity regression
# checks for Neko-TOP's topology-optimization objectives/constraints.
#
# Unlike check_valgrind.yml, this is NOT wired into pr_develop.yml's
# check_complete gate — these tests are a heavier, opt-in lane (see
# tests/regression/sensitivity/run_sensitivity_regression_check.sh, which
# skips with CTest's "Not Run" status unless
# NEKO_TOP_RUN_SENSITIVITY_REGRESSION is set) and are triggered manually via
# workflow_dispatch rather than on every PR, so they never affect PR-blocking
# time budget.

name: Check sensitivity regression (manual)

on:
  workflow_dispatch: {}

env:
  PFUNIT_VERSION: v4.12.0
  JSON_FORTRAN_VERSION: 9.2.1
  NEKO_VERSION: neko-top
  HDF5_VERSION: hdf5_1_14_6

jobs:
  sensitivity-regression:
    name: Sensitivity regression (CPU)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gfortran gcc libopenblas-dev \
            libopenmpi-dev openmpi-bin pkg-config liblapack-dev \
            ninja-build python3

      - name: Get json-fortran
        id: get-json-fortran
        uses: ./.github/actions/setup_json-fortran
        with:
          version: ${{ env.JSON_FORTRAN_VERSION }}
          compiler: gfortran

      - name: Get ParMETIS
        id: get-parmetis
        uses: ./.github/actions/setup_parmetis
        with:
          compiler: gfortran

      - name: Get HDF5
        id: get-hdf5
        uses: ./.github/actions/setup_hdf5
        with:
          version: ${{ env.HDF5_VERSION }}
          compiler: gfortran
          c-compiler: gcc

      - name: Get neko
        id: get-neko
        uses: ./.github/actions/setup_neko
        with:
          json-fortran-dir: ${{ steps.get-json-fortran.outputs.install-dir }}
          parmetis-dir: ${{ steps.get-parmetis.outputs.install-dir }}
          hdf5-dir: ${{ steps.get-hdf5.outputs.install-dir }}
          version: ${{ env.NEKO_VERSION }}
          precision: dp
          compiler: gfortran
          backend: CPU

      - name: Get pfunit
        id: get-pfunit
        uses: ./.github/actions/setup_pfunit
        with:
          version: ${{ env.PFUNIT_VERSION }}

      - name: Configuration
        env:
          JSON_FORTRAN_DIR: ${{ steps.get-json-fortran.outputs.install-dir }}
          NEKO_DIR: ${{ steps.get-neko.outputs.install-dir }}
          PFUNIT_DIR: ${{ steps.get-pfunit.outputs.install-dir }}
        run: |
          cmake -B build -S . -G Ninja --fresh \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON

      - name: Run sensitivity regression ctests
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
          NEKO_TOP_RUN_SENSITIVITY_REGRESSION: 1
        run: |
          ctest --test-dir build -L sensitivity -R regression --parallel 1

      - name: Save sensitivity regression logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sensitivity-regression-logs
          path: |
            build/Testing/Temporary/
            build/tests/regression/sensitivity/
          overwrite: true
          if-no-files-found: ignore
