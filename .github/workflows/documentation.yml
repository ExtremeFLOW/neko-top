name: Deploy documentation to Pages

# Runs on every push to the develop branch. Since the develop branch is
# protected, only pull requests can be merged into it. This ensures that the
# documentation is only built and deployed when a pull request is merged.
on:
  workflow_call:
  push:
    branches:
      - "develop"
      - "cicd/*"

jobs:
  build:
    # Specify runner +  build & upload the static files as an artifact
    runs-on: ubuntu-latest
    steps:
      - name: Setup system
        shell: bash
        run: |
          sudo apt install git cmake doxygen graphviz

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure documentation
        run: |
          cmake -DONLY_DOCS=ON -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build documentation
        run: |
          cmake --build build --target Documentation

      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: documentation/html/

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4