name: Documentation

# Builds the documentation to check that it builds, and makes it available as
# an artifact for review. Publishing the documentation is done by the
# publish_documentation.yml workflow.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------------------- #
  # Build Documentation job

  build-docs:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create cache key based on commit SHA
        id: create-key
        shell: bash
        run: |
          # Get the GIT sha for the current commit
          key="documentation-$(git rev-parse HEAD)"
          printf "key=%s\n" "$key" | tee -a $GITHUB_OUTPUT

      - name: Create cache the documentation
        id: cache-documentation
        uses: actions/cache@v5
        with:
          path: documentation/html/
          key: ${{ steps.create-key.outputs.key }}

      - name: Setup system
        if: steps.cache-documentation.outputs.cache-hit != 'true'
        run: sudo apt install git cmake doxygen graphviz

      - name: Configure
        if: steps.cache-documentation.outputs.cache-hit != 'true'
        run: cmake -DONLY_DOCS=ON -B build -S .

      - name: Build
        if: steps.cache-documentation.outputs.cache-hit != 'true'
        run: cmake --build build --target Documentation

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: documentation/html/
