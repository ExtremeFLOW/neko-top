# This workflow runs the MPI-only Neko/Python controller regression.
name: Check MPMD controller regression

on:
  workflow_call:
    inputs:
      neko-version:
        description: "The version of Neko to use."
        required: true
        type: string
      json-fortran-version:
        description: "The version of JSON-Fortran to use."
        required: true
        type: string
      pfunit-version:
        description: "The version of pFUnit to use."
        required: true
        type: string
      hdf5-version:
        description: "The version of HDF5 to use."
        required: true
        type: string

jobs:
  mpmd-controller-regression:
    name: MPMD controller regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gfortran gcc libopenblas-dev \
            libopenmpi-dev openmpi-bin pkg-config liblapack-dev ninja-build

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip

      - name: Install mpi4py
        run: MPICC=mpicc python -m pip install --no-binary=mpi4py mpi4py

      - name: Get JSON-Fortran
        id: get-json-fortran
        uses: ./.github/actions/setup_json-fortran
        with:
          version: ${{ inputs.json-fortran-version }}
          compiler: gfortran

      - name: Get ParMETIS
        id: get-parmetis
        uses: ./.github/actions/setup_parmetis
        with:
          compiler: gfortran

      - name: Get HDF5
        id: get-hdf5
        uses: ./.github/actions/setup_hdf5
        with:
          version: ${{ inputs.hdf5-version }}
          compiler: gfortran
          c-compiler: gcc

      - name: Get Neko
        id: get-neko
        uses: ./.github/actions/setup_neko
        with:
          json-fortran-dir: ${{ steps.get-json-fortran.outputs.install-dir }}
          parmetis-dir: ${{ steps.get-parmetis.outputs.install-dir }}
          hdf5-dir: ${{ steps.get-hdf5.outputs.install-dir }}
          version: ${{ inputs.neko-version }}
          precision: dp
          compiler: gfortran
          backend: CPU

      - name: Get pFUnit
        id: get-pfunit
        uses: ./.github/actions/setup_pfunit
        with:
          version: ${{ inputs.pfunit-version }}

      - name: Configure
        env:
          JSON_FORTRAN_DIR: ${{ steps.get-json-fortran.outputs.install-dir }}
          NEKO_DIR: ${{ steps.get-neko.outputs.install-dir }}
          PFUNIT_DIR: ${{ steps.get-pfunit.outputs.install-dir }}
        run: |
          cmake -B build -S . -G Ninja --fresh \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON

      - name: Run MPMD controller regression
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        run: ctest --test-dir build -L mpmd --parallel 1

      - name: Save MPMD controller logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mpmd-controller-regression-logs
          path: |
            build/Testing/Temporary/
            build/tests/regression/mpmd_controller/
          overwrite: true
          if-no-files-found: ignore
