# Check the linting of the Fortran source files in the repository.
#
# This workflow checks the linting of the Fortran source files in the
# repository. It uses the `flint` linting tool.
# The workflow is split into multiple jobs:
# - Score base: Computes a linting score for the base of the changes, i.e. the
#   base branch of the pull request or merge group, the previous commit of a
#   push, or develop for other events.
# - Score current branch: Computes a linting score for the current branch.
# - Check scores: Checks if the current branch has a lower score than the base.
# - Lint changes: Runs the flint linter on the changed Fortran files and
#   provides suggestions for improvements.
# - Create badge: Creates a badge for the flint score.
#
# The workflow will fail if the current branch has a lower score than the
# base, when Fortran files have changed.

name: Linting

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# The directories scored on both branches. The check compares the two average
# scores, so both jobs must score the same directories.
env:
  LINT_PATHS: sources/ examples/ tests/

jobs:
  score-base:
    name: Score base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      score: ${{ steps.save-score.outputs.score }}

    steps:
      - name: Checkout the base
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: >-
            ${{ github.event.pull_request.base.sha
            || github.event.merge_group.base_sha
            || github.event.before
            || 'develop' }}

      - name: Run flint
        id: lint
        uses: ./.github/actions/flint
        with:
          path: ${{ env.LINT_PATHS }}
          depth: 10
          rc-file: flinter_rc.yml

      - name: Save the score
        id: save-score
        env:
          SCORE: ${{ steps.lint.outputs.score }}
        run: |
          echo "Base score=$SCORE"
          echo "score=$SCORE" >> "$GITHUB_OUTPUT"

  score-current:
    name: Score current branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      score: ${{ steps.save-score.outputs.score }}

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Lint repository
        id: lint
        uses: ./.github/actions/flint
        with:
          path: ${{ env.LINT_PATHS }}
          depth: 10
          rc-file: flinter_rc.yml

      - name: Save the score
        id: save-score
        env:
          SCORE: ${{ steps.lint.outputs.score }}
        run: |
          echo "Current score=$SCORE"
          echo "score=$SCORE" >> "$GITHUB_OUTPUT"

  check-scores:
    name: Check scores
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - score-current
      - score-base

    steps:
      # The full history is needed to find the changes since the base commit.
      - name: Checkout current branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed
        uses: ./.github/actions/changed_fortran_files

      # Check if the current branch has a lower score than its base. If the
      # score is lower, the linting has failed and we require improvements.
      - name: Check the scores
        id: check-score
        env:
          base_score: ${{ needs.score-base.outputs.score }}
          current_score: ${{ needs.score-current.outputs.score }}
          changed_files: ${{ steps.changed.outputs.files }}
        run: |
          if [ -z "$base_score" ]; then
            echo "Base score not set: '$base_score'" >&2
            exit 1
          fi
          if [ -z "$current_score" ]; then
            echo "Current score not set: '$current_score'" >&2
            exit 1
          fi

          if [ -z "$changed_files" ]; then
            echo "No changes detected in Fortran files."
            exit 0
          fi

          if (($(echo "$current_score < $base_score" | bc -l))); then
            echo "Linting failed, the score is lower than the base" \
              "($current_score < $base_score)."
            echo "Please improve linting by applying suggestions."
            exit 2
          fi

  # Run the flint linter on the changed fortran files and provide suggestions
  # for improvements. The suggestions are saved in a linter-report.txt file.
  lint-changes:
    name: Suggest improvements
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - score-current
      - score-base
    env:
      # Provides pkg_resources for flinter, see requirements-flint.txt.
      PYTHONPATH: ${{ github.workspace }}/.github/actions/flint/compat

    steps:
      # The full history is needed to find the changes since the base commit.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup env.
        run: |
          sudo apt-get update
          sudo apt-get install -yq bc python3-dev python3-pip python3-tk
          pip install -r .github/actions/flint/requirements-flint.txt

      - name: Get changed files
        id: changed
        uses: ./.github/actions/changed_fortran_files

      # File lists are passed through the environment, as file names come
      # from the pull request and must not be interpreted as shell code.
      - name: Lint changed files
        id: lint-changes
        env:
          changed_files: ${{ steps.changed.outputs.files }}
        run: |
          if [ -z "$changed_files" ]; then
            echo "No fortran files changed"
            exit 0
          fi

          failed_files=()
          printf "Linting files:\n"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            score=$(flint score -r flinter_rc.yml "$(realpath "$file")" \
              2> /dev/null | grep -oP '(?<=\>\|)[^\|\<]+(?=\|\<)')
            printf '\t- %s: %s\n' "$file" "$score"

            if (($(echo "$score < 10" | bc -l))); then
              failed_files+=("$file")
            fi
          done <<< "$changed_files"

          {
            echo "failed-files<<EOF"
            if [ ${#failed_files[@]} -gt 0 ]; then
              printf '%s\n' "${failed_files[@]}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Print possible improvements
        if: ${{ steps.lint-changes.outputs.failed-files != '' }}
        env:
          failed_files: ${{ steps.lint-changes.outputs.failed-files }}
        run: |
          printf "Files that can be improved:\n" | tee linter-report.txt
          while IFS= read -r file; do
            printf '\t- %s\n' "$file" | tee -a linter-report.txt
          done <<< "$failed_files"

          while IFS= read -r file; do
            report=$(flint lint -r flinter_rc.yml "$file")
            if [ -z "$report" ]; then
              report=$(flint stats -r flinter_rc.yml "$file")
            fi

            printf "%.s-" {1..80} | tee -a linter-report.txt
            printf "\n" | tee -a linter-report.txt
            printf 'Linting improvements for \n\t%s\n\n' "$file" |
              tee -a linter-report.txt
            echo "$report" | tee -a linter-report.txt
          done <<< "$failed_files"

      - name: Save linter report
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: linter-report.txt
          if-no-files-found: ignore
