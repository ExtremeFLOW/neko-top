# Description: This file defines the workflow that will be run when a new
#              merge group is created. The workflow will run the automated
#              setup and example execution scripts.
name: Test Examples

# This workflow is only defined here. It is triggered from other workflows.
on:
  workflow_call:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

# Read-only access by default. Jobs that need more ask for it themselves.
permissions:
  contents: read

# ---------------------------------------------------------------------------- #
# Define the jobs that will be run in this workflow. The jobs are run in a

jobs:
  # -------------------------------------------------------------------------- #
  # Define the compilation and testing job that will be run in this workflow.
  # This job will build the Neko-TOP code in debug mode and run the unit tests.

  execute-scripts:
    name: Execute setup and examples
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Build HDF5 (setup.sh only does so when HDF5_ROOT is set); neko needs
      # it for the HDF5 and VTKHDF output the examples write.
      HDF5_ROOT: hdf5
      # The runners have no UCX-capable network devices. Disable the UCX
      # one-sided (osc) component so OpenMPI does not write
      # "OSC UCX component priority set inside component query failed" to
      # stderr, which run.sh would treat as a failed case.
      OMPI_MCA_osc: "^ucx"

    steps:
      # ---------------------------------------------------------------------- #
      # Checkout the repository and setup the environment
      # ---------------------------------------------------------------------- #

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin pkg-config liblapack-dev \
            ninja-build libblas-dev libopenmpi-dev

      # ---------------------------------------------------------------------- #
      # Run the setup and example execution scripts
      # ---------------------------------------------------------------------- #

      - name: Setup
        run: |
          ./setup.sh

      # Run each example for a few of its own timesteps and a few optimization
      # iterations, so the job checks that every example runs end to end.
      - name: Shorten the examples
        run: |
          python3 .github/workflows/extra/shorten_cases.py \
            --steps 10 --iterations 2 examples/

      - name: Run all gauntlet of examples
        run: |
          ./run.sh -rca

      - name: Display logs on failure
        if: failure()
        run: |
          if [ -d logs ]; then
            LOGS=$(find logs/ -type f -name "*.log")
            for log in ${LOGS[@]}; do
              echo ""
              echo "Log file: $log"
              echo ""
              cat $log
              echo ""
              echo "End of log file: $log"
            done

            exit 1
          fi
