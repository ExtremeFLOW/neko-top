# This workflow checks the compilation of the Neko-TOP library.

name: Check Neko-TOP compilation

# This workflow is only defined here. It is triggered from other workflows.
on:
  workflow_call:
    inputs:
      neko-version:
        description: "The version of Neko to use."
        required: true
        type: string
      json-fortran-version:
        description: "The version of json-fortran to use."
        required: true
        type: string
      pfunit-version:
        description: "The version of pFUnit to use."
        required: true
        type: string
      hdf5-version:
        description: "The version of HDF5 to use."
        required: true
        type: string
      runner-images:
        description: "JSON list of GitHub-hosted runner images to test on."
        required: false
        type: string
        default: '["ubuntu-24.04", "ubuntu-latest"]'

# Read-only access by default. Jobs that need more ask for it themselves.
permissions:
  contents: read

# ---------------------------------------------------------------------------- #
# Define the jobs that will be run in this workflow. The jobs are run in a

jobs:
  # -------------------------------------------------------------------------- #
  # Define the compilation and testing job that will be run in this workflow.
  # This job will build the Neko-TOP code in debug mode and run the unit tests.

  neko-top-debug:
    # ------------------------------------------------------------------------ #
    # Define the Matrix for the job.
    # ------------------------------------------------------------------------ #

    strategy:
      fail-fast: false
      matrix:
        # Default matrix
        os: ${{ fromJSON(inputs.runner-images) }}
        precision: [dp]
        backend: [CPU, CUDA, HIP]
        compiler: [GNU-13, GNU-14, GNU-15]

        exclude:
          # ROCm is only published for Ubuntu 22.04 and 24.04. On newer images
          # the 24.04 build of ROCm's lld fails to load (libxml2.so.2 is gone),
          # so CMake cannot identify the HIP compiler. Re-enable once ROCm
          # ships packages for the release behind ubuntu-latest.
          - os: ubuntu-latest
            backend: HIP

          # A compiler can only use the system OpenMPI's mpi_f08 module if it
          # reads the module format of the gfortran that built OpenMPI. Ubuntu
          # 24.04 builds OpenMPI with gfortran 13 (format shared by gfortran
          # 8-14) and has no gfortran 15. Ubuntu 26.04 (ubuntu-latest) builds
          # it with gfortran 15, whose format gfortran 13 and 14 cannot read.
          # Revisit when ubuntu-latest moves to a new release.
          - os: ubuntu-24.04
            compiler: GNU-15
          - os: ubuntu-latest
            compiler: GNU-13
          - os: ubuntu-latest
            compiler: GNU-14

        # Define the setup jobs.
        include:
          - compiler: GNU-13
            setup-compiler: |
              echo "FC=gfortran-13" >> $GITHUB_ENV
              echo "OMPI_FC=gfortran-13" >> $GITHUB_ENV
              echo "c-compiler=gcc-13" >> $GITHUB_OUTPUT
              echo "f-compiler=gfortran-13" >> $GITHUB_OUTPUT

          - compiler: GNU-14
            setup-compiler: |
              echo "FC=gfortran-14" >> $GITHUB_ENV
              echo "OMPI_FC=gfortran-14" >> $GITHUB_ENV
              echo "c-compiler=gcc-14" >> $GITHUB_OUTPUT
              echo "f-compiler=gfortran-14" >> $GITHUB_OUTPUT

          - compiler: GNU-15
            setup-compiler: |
              echo "FC=gfortran-15" >> $GITHUB_ENV
              echo "OMPI_FC=gfortran-15" >> $GITHUB_ENV
              echo "c-compiler=gcc-15" >> $GITHUB_OUTPUT
              echo "f-compiler=gfortran-15" >> $GITHUB_OUTPUT

          - backend: CUDA
            setup-backend: |
              echo "backend-path=/usr" >> $GITHUB_OUTPUT

          - backend: HIP
            setup-backend: |
              ROCM_DIR=$(ls -d /opt/rocm-*)
              CMAKE_PREFIX_PATH="$ROCM_DIR/lib/cmake:$CMAKE_PREFIX_PATH"
              echo "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH" >> $GITHUB_ENV
              echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$ROCM_DIR/lib" >> $GITHUB_ENV
              echo "backend-path=$ROCM_DIR" >> $GITHUB_OUTPUT

    # ------------------------------------------------------------------------ #
    # Define the job itself.
    # ------------------------------------------------------------------------ #
    name: ${{ matrix.backend }} - ${{ matrix.compiler }} - ${{ matrix.precision }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      JOB_NAME: ${{ matrix.backend }}-${{ matrix.compiler }}-${{ matrix.precision }}-${{ matrix.os }}
      # The runners have no UCX-capable network devices. Disable the UCX
      # one-sided (osc) component so OpenMPI does not write
      # "OSC UCX component priority set inside component query failed" to
      # stderr, which run.sh would treat as a failed case.
      OMPI_MCA_osc: "^ucx"
    steps:
      # ---------------------------------------------------------------------- #
      # Checkout the repository and setup the environment
      # ---------------------------------------------------------------------- #

      - name: Checkout
        uses: actions/checkout@v7

      # ubuntu-latest moves between releases, so derive the actual release
      # for distribution-specific package repositories.
      - name: Detect runner image
        id: image
        shell: bash
        run: |
          source /etc/os-release
          echo "codename=$VERSION_CODENAME" >> $GITHUB_OUTPUT

      - name: Setup Compiler
        id: setup-compiler
        shell: bash
        run: ${{ matrix.setup-compiler }}

      - name: Setup system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libopenblas-dev libopenmpi-dev \
            openmpi-bin pkg-config liblapack-dev ninja-build

      # Setup device specific dependencies.
      #
      # The GPU toolchains are installed directly instead of through an apt
      # cache: restoring a multi-GB cache is no faster than downloading from the
      # package mirrors, and those caches use most of the 10 GB cache quota.
      # Only the compilers and the libraries we link are needed, as the runners
      # have no GPU to run on.

      # nvcc plus cudart/cusolver (neko-top) and cudart (neko). Recommends only
      # add profilers, documentation and Java/X11 dependencies.
      - name: Setup Device (CUDA)
        if: matrix.backend == 'cuda'
        run: |
          sudo apt-get install -y --no-install-recommends nvidia-cuda-toolkit
          # Drop the downloaded packages to free disk space.
          sudo apt-get clean

      # The HIP compiler and runtime plus hipblas/hipsolver (neko-top). The
      # kernel driver (amdgpu-dkms) is not needed to compile.
      - name: Setup Device (HIP)
        if: matrix.backend == 'hip'
        env:
          CODENAME: ${{ steps.image.outputs.codename }}
        run: |
          # Following the instructions from https://rocm.docs.amd.com/projects/install-on-linux/en/latest/install/quick-start.html

          wget -r -np -nd -A 'amdgpu*.deb' https://repo.radeon.com/amdgpu-install/7.2.1/ubuntu/$CODENAME/
          sudo apt-get install -y ./amdgpu-install_*.deb
          sudo apt-get update
          sudo apt-get install -y rocm-dev hipblas-dev hipsolver-dev
          # Drop the downloaded packages to free disk space.
          sudo apt-get clean
          rm -f amdgpu-install_*.deb

      - name: Setup backend
        id: setup-backend
        shell: bash
        run: ${{ matrix.setup-backend }}

      # ---------------------------------------------------------------------- #
      # Setup the external dependencies
      # ---------------------------------------------------------------------- #

      - name: Get json-fortran
        id: get-json-fortran
        uses: ./.github/actions/setup_json-fortran
        with:
          version: ${{ inputs.json-fortran-version }}
          compiler: ${{ steps.setup-compiler.outputs.f-compiler }}

      - name: Get ParMETIS
        id: get-parmetis
        uses: ./.github/actions/setup_parmetis
        with:
          compiler: ${{ steps.setup-compiler.outputs.f-compiler }}

      - name: Get HDF5
        id: get-hdf5
        uses: ./.github/actions/setup_hdf5
        with:
          version: ${{ inputs.hdf5-version }}
          compiler: ${{ steps.setup-compiler.outputs.f-compiler }}
          c-compiler: ${{ steps.setup-compiler.outputs.c-compiler }}

      - name: Get neko
        id: get-neko
        uses: ./.github/actions/setup_neko
        with:
          json-fortran-dir: ${{ steps.get-json-fortran.outputs.install-dir }}
          json-fortran-version: ${{ inputs.json-fortran-version }}
          parmetis-dir: ${{ steps.get-parmetis.outputs.install-dir }}
          parmetis-version: ${{ steps.get-parmetis.outputs.version }}
          hdf5-root: ${{ steps.get-hdf5.outputs.install-dir }}
          hdf5-version: ${{ inputs.hdf5-version }}
          version: ${{ inputs.neko-version }}
          precision: ${{ matrix.precision }}
          compiler: ${{ steps.setup-compiler.outputs.f-compiler }}
          backend: ${{ matrix.backend }}
          backend-path: ${{ steps.setup-backend.outputs.backend-path }}

      - name: Get pfunit
        id: get-pfunit
        uses: ./.github/actions/setup_pfunit
        with:
          version: ${{ inputs.pfunit-version }}

      # ---------------------------------------------------------------------- #
      # Build and test the code
      # ---------------------------------------------------------------------- #

      - name: Configuration
        env:
          JSON_FORTRAN_DIR: ${{ steps.get-json-fortran.outputs.install-dir }}
          NEKO_DIR: ${{ steps.get-neko.outputs.install-dir }}
          PFUNIT_DIR: ${{ steps.get-pfunit.outputs.install-dir }}
          HDF5_ROOT: ${{ steps.get-hdf5.outputs.install-dir }}
        run: |
          if [ "${{ matrix.backend }}" == "CPU" ]; then
            TEST=ON
          else
            TEST=OFF
          fi
          cmake -B build -S . -G Ninja --fresh \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DBUILD_TESTING=$TEST

      - name: Building Library
        run: |
          cmake --build build --parallel

      # ---------------------------------------------------------------------- #
      # Run the tests, which is only done on the CPU backend as the github
      # runner does not have a GPU available.
      # ---------------------------------------------------------------------- #

      - name: Running Unit Tests
        if: ${{ matrix.backend == 'cpu' }}
        run: |
          ctest -L unit --test-dir build --output-on-failure --parallel

      - name: Building Examples
        if: ${{ matrix.backend == 'cpu' }}
        run: |
          cmake --build build --target Examples --parallel

      - name: Run Rugby Ball
        if: ${{ matrix.backend == 'cpu' }}
        env:
          NEKO_DIR: ${{ steps.get-neko.outputs.install-dir }}
          JSON_FORTRAN_DIR: ${{ steps.get-json-fortran.outputs.install-dir }}
          PARMETIS_DIR: ${{ steps.get-parmetis.outputs.install-dir }}
        run: |
          # Run 10 timesteps and 2 optimization iterations of the rugby ball
          python3 .github/workflows/extra/shorten_cases.py \
            --steps 10 --iterations 2 examples/rugby_ball/rugby_ball.case

          ./run.sh -rc rugby_ball

      # ---------------------------------------------------------------------- #
      # Report errors if any step fails
      # ---------------------------------------------------------------------- #
      - name: Report errors
        if: failure()
        run: |
          [ ! -d logs ] && exit
          echo "Errors encountered during script execution."
          echo "Please check the logs for details."
          logs=($(find logs/ -name "error.log"))

          for file in ${logs[@]}; do
            if [[ -s $file ]]; then
              printf "\nContents of $file:\n" >&2
              cat $file >&2
            elif [ -f $file ]; then
              rm -fr $(dirname $file)
            fi
          done

      - name: Save logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.JOB_NAME }}-logs
          path: logs/
          overwrite: true
          if-no-files-found: ignore
