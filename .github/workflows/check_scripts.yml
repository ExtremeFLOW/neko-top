# This workflow checks the compilation of the Neko-TOP library.

name: Scripting Checks

# This workflow is only defined here. It is triggered from other workflows.
on:
  workflow_call:
    inputs:
      json-fortran-version:
        description: "The version of json-fortran to use."
        required: true
        type: string
      neko-version:
        description: "The version of Neko to use."
        required: true
        type: string
      hdf5-version:
        description: "The version of HDF5 to use."
        required: true
        type: string
      neko-top-version:
        description: "The version of Neko-TOP to use."
        required: true
        type: string
      runner-images:
        description: "JSON list of GitHub-hosted runner images to test on."
        required: false
        type: string
        default: '["ubuntu-24.04", "ubuntu-latest"]'

env:
  # Set the default versions of the dependencies
  JSON_FORTRAN_VERSION: ${{ inputs.json-fortran-version }}
  NEKO_VERSION: ${{ inputs.neko-version }}
  NEKO_TOP_VERSION: ${{ inputs.neko-top-version }}
  HDF5_VERSION: ${{ inputs.hdf5-version }}
  HDF5_ROOT: hdf5
  # The runners have no UCX-capable network devices. Disable the UCX one-sided
  # (osc) component so OpenMPI does not write
  # "OSC UCX component priority set inside component query failed" to stderr,
  # which run.sh would treat as a failed case.
  OMPI_MCA_osc: "^ucx"

# Read-only access by default. Jobs that need more ask for it themselves.
permissions:
  contents: read

# ---------------------------------------------------------------------------- #
# Define the jobs that will be run in this workflow. The jobs are run in a

jobs:
  # -------------------------------------------------------------------------- #
  # Define the compilation and testing job that will be run in this workflow.
  # This job will build the Neko-TOP code in debug mode and run the unit tests.

  setup-script:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runner-images) }}

    name: Check setup script - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      # ---------------------------------------------------------------------- #
      # Checkout the repository and setup the environment
      # ---------------------------------------------------------------------- #

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin pkg-config liblapack-dev \
            ninja-build libopenblas-dev libopenmpi-dev

      - name: Setup python environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: "pip"
          cache-dependency-path: tests/**/requirements.txt

      - name: Install python dependencies
        run: |
          pip install -r tests/regression/mma/requirements.txt

      # ---------------------------------------------------------------------- #
      # Build and test the code
      # ---------------------------------------------------------------------- #

      - name: Setup Neko-TOP
        run: ./setup.sh --examples --tests

      - name: Run TGV
        run: ./run.sh -nrc tgv

      - name: Run Rugby Ball
        run: |
          # Run 10 timesteps and 2 optimization iterations of the rugby ball
          python3 .github/workflows/extra/shorten_cases.py \
            --steps 10 --iterations 2 examples/rugby_ball/rugby_ball.case

          ./run.sh -rc rugby_ball

      - name: Run short tests
        env:
          OMP_NUM_THREADS: 1
          NEKO_GS_COMM: "MPI"
        run: ./tests/test.sh --procs 2 mma unit

      # ---------------------------------------------------------------------- #
      # Report errors if any step fails
      # ---------------------------------------------------------------------- #

      - name: Report example errors
        if: failure()
        run: |
          if [ ! -d logs/ ]; then exit 0; fi
          echo "Errors encountered during script execution."
          echo "Please check the logs for details."
          logs=($(find logs/ -name "error.log"))

          for file in ${logs[@]}; do
            if [[ -s $file ]]; then
              printf "\nContents of $file:\n" >&2
              cat $file >&2
            elif [ -f $file ]; then
              rm -fr $(dirname $file)
            fi
          done

      - name: Save logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: setup-script-logs-${{ matrix.os }}
          path: tests/
          overwrite: true
          if-no-files-found: ignore
