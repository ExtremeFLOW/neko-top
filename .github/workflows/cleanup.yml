# Cleanup.yml
# -------------------------------------------------------------------------- #
# Cleanup workflow upon merge. Remove stored cache and temporary files.
# -------------------------------------------------------------------------- #

name: Cleanup After Merge
on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - closed
jobs:
  cleanup:
    name: Cleanup Caches
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - name: Remove Cache from merged Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: refs/pull/${{ github.event.pull_request.number }}/merge

        run: |
          echo "Fetching list of cache keys"
          cacheKeysForPR=$(gh cache list --ref $BRANCH --limit 100 --json id --jq '.[].id')

          ## Setting this to not fail the workflow while deleting cache keys.
          set +e
          echo "Deleting caches..."
          for cacheKey in $cacheKeysForPR
          do
              echo "Deleting cache with key: $cacheKey"
              gh cache delete $cacheKey
          done
          echo "Done"

      - name: Cleanup Cache from Merge queue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: refs/heads/gh-readonly-queue/${{ github.event.pull_request.base.ref }}/pull-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

        run: |
          echo "Fetching list of cache keys"
          cacheKeysForMergeQueue=$(gh cache list --ref $BRANCH --limit 100 --json id --jq '.[].id')
          echo "Deleting caches..."
          for cacheKey in $cacheKeysForMergeQueue
          do
              echo "Deleting cache with key: $cacheKey"
              gh cache delete $cacheKey
          done
          echo "Done"


