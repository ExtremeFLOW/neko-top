# Cleanup.yml
# ---------------------------------------------------------------------------- #
# Remove caches that no other branch can use: those created for a pull
# request's merge ref, and those created by merge queue runs.
# ---------------------------------------------------------------------------- #

name: Cleanup After Merge
on:
  workflow_call: # Called at the end of merge queue (merge_group) runs
  pull_request_target: # Trigger on pull request close
    types: closed

permissions:
  actions: write # To list and delete caches

jobs:
  cleanup:
    name: Cleanup Caches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: only the gh CLI is needed, and pull_request_target jobs
      # should not check out code.
      - name: Remove caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGE_GROUP_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          # Select the caches to remove: those whose ref equals EXACT_REF or
          # starts with REF_PREFIX. Both are checked to be non-empty, as an
          # empty prefix would match every cache in the repository.
          case "$EVENT_NAME" in
            pull_request_target)
              # The pull request's merge ref, and any merge queue branches
              # created for it (gh-readonly-queue/<base>/pr-<number>-<sha>).
              EXACT_REF="refs/pull/$PR_NUMBER/merge"
              REF_PREFIX="refs/heads/gh-readonly-queue/$BASE_REF/pr-$PR_NUMBER-"
              [[ -n "$PR_NUMBER" && -n "$BASE_REF" ]] || exit 1
              ;;
            merge_group)
              # The merge queue branch of this run.
              EXACT_REF="$MERGE_GROUP_REF"
              REF_PREFIX="$MERGE_GROUP_REF"
              [[ -n "$MERGE_GROUP_REF" ]] || exit 1
              ;;
            *)
              echo "Nothing to clean up for $EVENT_NAME events."
              exit 0
              ;;
          esac
          export EXACT_REF REF_PREFIX
          echo "Removing caches for $EXACT_REF and $REF_PREFIX*"

          ids=$(gh cache list --limit 1000 --json id,ref --jq '.[]
            | select(.ref == env.EXACT_REF or (.ref | startswith(env.REF_PREFIX)))
            | .id')

          if [ -z "$ids" ]; then
            echo "No caches found."
            exit 0
          fi
          for id in $ids; do
            echo "Deleting cache $id"
            gh cache delete "$id"
          done
