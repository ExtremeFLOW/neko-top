name: 'Close stale issues and PRs'
on:
  schedule:
    - cron: '30 1 * * *'

permissions:
  actions: write
  pull-requests: write

jobs:
  stale:
    name: Close stale PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          days-before-stale: -1 # Disable automatic marking of issues and PRs as stale
          days-before-close: -1 # Disable automatic closing of issues and PRs
          stale-pr-message: 'This PR is stale because it has been open 30 days with no activity. Remove stale label or comment or this will be closed in 30 days.'
          close-pr-message: 'This PR was closed because it has been stale for 30 days with no activity.'
          days-before-pr-stale: 30
          days-before-pr-close: 30
          exempt-draft-pr: true